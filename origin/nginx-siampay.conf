# /etc/nginx/sites-available/siampay
# TLS termination for Cloudflare -> origin (Full strict) with a Let's Encrypt certificate (not Cloudflare-issued).
# Serves the React Edge Console from /var/www/siampay/dist and proxies the API to Node on 127.0.0.1:8080.

# Anything that isn't app.strikemap.space (e.g. https://<origin-ip>) is refused during the TLS handshake.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.strikemap.space;

    ssl_certificate     /etc/ssl/siampay/fullchain.pem;
    ssl_certificate_key /etc/ssl/siampay/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/siampay/dist;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://tunnel.strikemap.space; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    # API + assignment endpoint -> Node
    location ~ ^/(api/|headers$|healthz$) {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Expose the Cloudflare -> origin TLS session and the connecting Cloudflare IP to the app
        proxy_set_header X-Origin-TLS-Protocol $ssl_protocol;
        proxy_set_header X-Origin-TLS-Cipher $ssl_cipher;
        proxy_set_header X-Edge-IP $remote_addr;
    }

    # Fingerprinted build assets: cache for a year (Cloudflare caches them at the edge too)
    location /assets/ {
        expires 1y;
        access_log off;
    }

    location /flags/ {
        expires 1d;
    }

    # SPA: every other path renders the console
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
