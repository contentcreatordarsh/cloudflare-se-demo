# /etc/nginx/sites-available/siampay
# TLS termination for Cloudflare -> origin (Full strict). Let's Encrypt cert, not Cloudflare-issued.

# Anything that isn't app.strikemap.space (e.g. https://<origin-ip>) is dropped.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.strikemap.space;

    ssl_certificate     /etc/ssl/siampay/fullchain.pem;
    ssl_certificate_key /etc/ssl/siampay/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Expose the Cloudflare -> origin TLS session to the app (shown in the console)
        proxy_set_header X-Origin-TLS-Protocol $ssl_protocol;
        proxy_set_header X-Origin-TLS-Cipher $ssl_cipher;
    }
}
